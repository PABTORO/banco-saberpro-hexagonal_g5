spring.application.name=banco-saberpro-hexagonal

# Base de datos H2 en memoria (solo la usa JpaQuestionAdapter)
spring.datasource.url=jdbc:h2:mem:bancosaberprodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Adaptador de salida por defecto: JPA.
# Para usar el adaptador en memoria: --spring.profiles.active=memory
